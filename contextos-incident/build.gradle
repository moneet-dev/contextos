plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'contextos.examples', rootProject.file('examples').absolutePath
}

// A JavaExec task rather than the 'application' plugin, so the root project's
// `./gradlew run` keeps running only the SQL Schema Context demo.
tasks.register('demo', JavaExec) {
    group = 'application'
    description = 'Runs the Incident Context demo against examples/runtime.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.moneet.contextos.incident.IncidentContextDemo'
    workingDir = rootProject.projectDir
}
