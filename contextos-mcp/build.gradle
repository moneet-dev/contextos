plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// MCP server over the ContextOS providers. Depends on the platform module only.
dependencies {
    implementation project(':contextos')
    implementation 'io.modelcontextprotocol.sdk:mcp:2.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'contextos.examples', rootProject.file('examples').absolutePath
}

// Self-contained jar for registering the server with an MCP client:
//   java -jar contextos-mcp/build/libs/contextos-mcp-all.jar <examples-dir>
// A Jar task rather than the 'application' plugin, so the root project's
// `./gradlew run` keeps running only the SQL Schema Context demo.
tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'Builds a runnable jar with all dependencies.'
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': 'dev.moneet.contextos.mcp.ContextOsMcpServer'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}
