plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// The platform layer: links the domain providers into one investigation.
dependencies {
    api project(':contextos-core')
    api project(':contextos-sql')
    api project(':contextos-code')
    api project(':contextos-incident')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    // JDBC drivers for configured databases; SQLite comes with SQL Schema Context.
    // Other databases (e.g. MySQL, whose driver is GPL) need their driver jar on the classpath.
    runtimeOnly 'org.postgresql:postgresql:42.7.13'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'contextos.examples', rootProject.file('examples').absolutePath
}

tasks.register('demo', JavaExec) {
    group = 'application'
    description = 'Investigates INC-143 across incident, code and database context.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.moneet.contextos.ContextOsDemo'
    workingDir = rootProject.projectDir
}
